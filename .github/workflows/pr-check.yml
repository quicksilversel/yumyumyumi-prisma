name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      # Build pre-renders pages that query the database, so it only runs
      # once the DATABASE_URL repo secret is configured.
      - name: Build
        if: env.DATABASE_URL != ''
        run: npm run build
        env:
          AUTH_SECRET: ci-build-placeholder
